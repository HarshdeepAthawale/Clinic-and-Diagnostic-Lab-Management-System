# Test profile. The datasource is provided by Testcontainers (@ServiceConnection);
# these values only stop the placeholders in application.yml from failing to resolve.
spring:
  datasource:
    url: jdbc:postgresql://replaced-by-testcontainers/test
    username: test
    password: test

app:
  reminders:
    # Tests call ReminderJob.sendDue() directly instead of waiting for the schedule.
    enabled: false
  auth:
    jwt-secret: test-only-jwt-secret-that-is-long-enough-0123456789
    cookie-secure: true
    # Tests sign in and fail from one address (the mock client's); the per-address cap must not trip across classes.
    max-failures-per-address: 100000
