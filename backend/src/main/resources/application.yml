spring:
  application:
    name: cdlms-backend
  datasource:
    # JDBC URL, e.g. jdbc:postgresql://<host>:5432/postgres?sslmode=require
    # For Supabase use the direct or session-pooler connection, not the transaction pooler (port 6543).
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (ADR-010). Hibernate only checks that entities match it.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    clean-disabled: true

server:
  port: 8080

app:
  reminders:
    # Email reminder for booked appointments (Phase 03). Needs spring.mail.* (SPRING_MAIL_HOST etc.);
    # without a mail server, reminders are only logged.
    lead-time: 24h
    poll-interval: 5m
    from: ${REMINDER_FROM:CDLMS Clinic <no-reply@cdlms.local>}
    clinic-name: ${CLINIC_NAME:CDLMS Clinic}
  clinic:
    # "Today" on dashboards is computed in the clinic's time zone, not the server's.
    zone: Asia/Kolkata
    # Letterhead on prescriptions and reports (Phase 04+). Empty values are simply left off.
    name: ${CLINIC_NAME:CDLMS Clinic & Diagnostic Lab}
    address: ${CLINIC_ADDRESS:}
    phone: ${CLINIC_PHONE:}
  billing:
    # The most the front desk may discount, as a share of the bill. Admins are not capped (ADR-023).
    reception-discount-cap-percent: ${RECEPTION_DISCOUNT_CAP_PERCENT:20}
  auth:
    jwt-secret: ${JWT_SECRET}
    token-ttl: 8h
    cookie-name: cdlms_token
    cookie-secure: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
