  <polygon points="695,183 782,233 695,283 608,233" fill="#fbeceb" stroke="#b42318" stroke-width="1.4"/>
  <text x="695" y="174" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#8a867f" font-size="11px" font-weight="700">7</text>
  <text x="695" y="231" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1c1b19" font-size="13px" font-weight="700">Sample</text><text x="695" y="246" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1c1b19" font-size="13px" font-weight="700">acceptable?</text>
  <text x="801" y="224" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">yes</text>
  <path d="M608 233 H572" stroke="#1c1b19" stroke-width="1.6" fill="none"/><polygon points="572.0,233.0 582.0,228.0 582.0,238.0" fill="#1c1b19"/>
  <text x="590" y="224" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">yes</text>
  <rect x="410" y="200" width="160" height="66" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/>
  <text x="422" y="218" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#8a867f" font-size="11px" font-weight="700">8</text><text x="490" y="236" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1c1b19" font-size="13px" font-weight="700">Test, enter results</text><text x="490" y="254" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#b42318" font-size="11px" font-weight="600">Lab technician</text>
  <path d="M410 233 H372" stroke="#1c1b19" stroke-width="1.6" fill="none"/><polygon points="372.0,233.0 382.0,228.0 382.0,238.0" fill="#1c1b19"/>
  <polygon points="285,183 372,233 285,283 198,233" fill="#fbeceb" stroke="#b42318" stroke-width="1.4"/>
  <text x="285" y="174" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#8a867f" font-size="11px" font-weight="700">9</text>
  <text x="285" y="231" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1c1b19" font-size="13px" font-weight="700">Result</text><text x="285" y="246" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1c1b19" font-size="13px" font-weight="700">plausible?</text>
  <text x="285" y="262" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#b42318" font-size="11px" font-weight="600">Pathologist</text>
  <path d="M198 233 H162" stroke="#1c1b19" stroke-width="1.6" fill="none"/><polygon points="162.0,233.0 172.0,228.0 172.0,238.0" fill="#1c1b19"/>
  <text x="180" y="224" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">yes</text>
  <rect x="20" y="200" width="140" height="66" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/>
  <text x="32" y="218" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#8a867f" font-size="11px" font-weight="700">10</text><text x="90" y="236" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1c1b19" font-size="13px" font-weight="700">Verify, report</text><text x="90" y="254" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#b42318" font-size="11px" font-weight="600">automatic</text>

  <!-- Loops -->
  <path d="M695 283 V340" stroke="#b42318" stroke-width="1.6" fill="none"/><polygon points="695.0,340.0 690.0,330.0 700.0,330.0" fill="#b42318"/>
  <text x="705" y="312" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">no</text>
  <rect x="615" y="342" width="160" height="60" rx="8" fill="#ffffff" stroke="#b42318" stroke-width="1.4"/>
  <text x="695" y="366" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1c1b19" font-size="13px" font-weight="700">Reject, redraw</text><text x="695" y="384" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">front desk calls patient back</text>
  <path d="M775 372 H900 V268" stroke="#b42318" stroke-width="1.6" fill="none"/><polygon points="900.0,268.0 905.0,278.0 895.0,278.0" fill="#b42318"/>
  <text x="908" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">new sample</text>

  <path d="M285 283 V340" stroke="#b42318" stroke-width="1.6" fill="none"/><polygon points="285.0,340.0 280.0,330.0 290.0,330.0" fill="#b42318"/>
  <text x="295" y="312" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">no</text>
  <rect x="205" y="342" width="160" height="60" rx="8" fill="#ffffff" stroke="#b42318" stroke-width="1.4"/>
  <text x="285" y="366" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1c1b19" font-size="13px" font-weight="700">Return for retest</text><text x="285" y="384" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">attempt kept, reason recorded</text>
  <path d="M365 372 H490 V268" stroke="#b42318" stroke-width="1.6" fill="none"/><polygon points="490.0,268.0 495.0,278.0 485.0,278.0" fill="#b42318"/>
  <text x="498" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">retest</text>

