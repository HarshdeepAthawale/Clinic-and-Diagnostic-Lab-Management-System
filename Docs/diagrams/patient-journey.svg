<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" role="img" aria-labelledby="t d">
  <title id="t">Patient journey flowchart</title>
  <desc id="d">From registration and consultation, through ordering tests, billing, sample collection, the receipt check with a redraw loop, testing, pathologist verification with a retest loop, report generation, dispatch and the patient reading the report.</desc>
  <rect width="1000" height="590" rx="14" fill="#f5f4f1"/>

  <!-- Row 1 -->
  <rect x="20" y="50" width="160" height="66" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/>
  <text x="32" y="68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#8a867f" font-size="11px" font-weight="700">1</text><text x="100" y="86" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1c1b19" font-size="13px" font-weight="700">Register patient</text><text x="100" y="104" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#b42318" font-size="11px" font-weight="600">Front desk</text>
  <path d="M180 83 H216" stroke="#1c1b19" stroke-width="1.6" fill="none"/><polygon points="216.0,83.0 206.0,88.0 206.0,78.0" fill="#1c1b19"/>
  <rect x="220" y="50" width="160" height="66" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/>
