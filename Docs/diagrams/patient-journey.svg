  <path d="M90 266 V456" stroke="#1c1b19" stroke-width="1.6" fill="none"/><polygon points="90.0,456.0 85.0,446.0 95.0,446.0" fill="#1c1b19"/>
  <rect x="20" y="460" width="160" height="66" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/>
  <text x="32" y="478" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#8a867f" font-size="11px" font-weight="700">11</text><text x="100" y="496" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1c1b19" font-size="13px" font-weight="700">Dispatch report</text><text x="100" y="514" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#b42318" font-size="11px" font-weight="600">Lab technician</text>
  <path d="M180 493 H216" stroke="#1c1b19" stroke-width="1.6" fill="none"/><polygon points="216.0,493.0 206.0,498.0 206.0,488.0" fill="#1c1b19"/>
  <rect x="220" y="460" width="170" height="66" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/>
  <text x="232" y="478" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#8a867f" font-size="11px" font-weight="700">12</text><text x="305" y="496" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1c1b19" font-size="13px" font-weight="700">Patient opens report</text><text x="305" y="514" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#b42318" font-size="11px" font-weight="600">Patient</text>
