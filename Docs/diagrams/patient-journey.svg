  <text x="810" y="500" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">pinned for the ordering doctor until acknowledged;</text>
  <text x="810" y="515" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">the lab sees it too, dispatch is not blocked</text>
</svg>
