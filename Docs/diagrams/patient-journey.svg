  <path d="M380 83 H416" stroke="#1c1b19" stroke-width="1.6" fill="none"/><polygon points="416.0,83.0 406.0,88.0 406.0,78.0" fill="#1c1b19"/>
  <rect x="420" y="50" width="160" height="66" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/>
  <text x="432" y="68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#8a867f" font-size="11px" font-weight="700">3</text><text x="500" y="86" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1c1b19" font-size="13px" font-weight="700">Consult, prescribe</text><text x="500" y="104" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#b42318" font-size="11px" font-weight="600">Doctor</text>
  <path d="M580 83 H616" stroke="#1c1b19" stroke-width="1.6" fill="none"/><polygon points="616.0,83.0 606.0,88.0 606.0,78.0" fill="#1c1b19"/>
  <rect x="620" y="50" width="160" height="66" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/>
  <text x="632" y="68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#8a867f" font-size="11px" font-weight="700">4</text><text x="700" y="86" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1c1b19" font-size="13px" font-weight="700">Order lab tests</text><text x="700" y="104" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#b42318" font-size="11px" font-weight="600">Doctor</text>
  <path d="M780 83 H816" stroke="#1c1b19" stroke-width="1.6" fill="none"/><polygon points="816.0,83.0 806.0,88.0 806.0,78.0" fill="#1c1b19"/>
  <rect x="820" y="50" width="160" height="66" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/>
  <text x="832" y="68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#8a867f" font-size="11px" font-weight="700">5</text><text x="900" y="86" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1c1b19" font-size="13px" font-weight="700">Invoice and payment</text><text x="900" y="104" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#b42318" font-size="11px" font-weight="600">Front desk</text>
  <path d="M900 116 V196" stroke="#1c1b19" stroke-width="1.6" fill="none"/><polygon points="900.0,196.0 895.0,186.0 905.0,186.0" fill="#1c1b19"/>

