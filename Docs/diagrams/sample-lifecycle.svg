<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="t d">
  <title id="t">Sample lifecycle state machine</title>
  <desc id="d">A sample moves ORDERED, COLLECTED, RECEIVED_AT_LAB, IN_TESTING, RESULT_ENTERED, VERIFIED, REPORT_GENERATED, DISPATCHED. It can be cancelled before collection, rejected at receipt or during testing (then redrawn as a new sample), and returned for retest from RESULT_ENTERED to IN_TESTING.</desc>
  <rect width="1000" height="440" rx="14" fill="#f5f4f1"/>

  <!-- Main path: 8 states, 110 wide, 125 apart -->
  <rect x="8" y="160" width="110" height="50" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/><text x="63" y="190" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="10.5px" font-weight="700">ORDERED</text>
  <rect x="133" y="160" width="110" height="50" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/><text x="188" y="190" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="10.5px" font-weight="700">COLLECTED</text>
  <rect x="258" y="160" width="110" height="50" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/><text x="313" y="185" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="10.5px" font-weight="700">RECEIVED_</text><text x="313" y="199" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="10.5px" font-weight="700">AT_LAB</text>
  <rect x="383" y="160" width="110" height="50" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/><text x="438" y="190" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="10.5px" font-weight="700">IN_TESTING</text>
  <rect x="508" y="160" width="110" height="50" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/><text x="563" y="185" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="10.5px" font-weight="700">RESULT_</text><text x="563" y="199" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="10.5px" font-weight="700">ENTERED</text>
  <rect x="633" y="160" width="110" height="50" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="688" y="190" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="10.5px" font-weight="700">VERIFIED</text>
  <rect x="758" y="160" width="110" height="50" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/><text x="813" y="185" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="10.5px" font-weight="700">REPORT_</text><text x="813" y="199" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="10.5px" font-weight="700">GENERATED</text>
  <rect x="883" y="160" width="110" height="50" rx="8" fill="#1c1b19" stroke="#1c1b19"/><text x="938" y="190" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#ffffff" font-size="10.5px" font-weight="700">DISPATCHED</text>

  <path d="M118 185 H129" stroke="#1c1b19" stroke-width="1.6" fill="none"/><polygon points="129.0,185.0 119.0,190.0 119.0,180.0" fill="#1c1b19"/><path d="M243 185 H254" stroke="#1c1b19" stroke-width="1.6" fill="none"/><polygon points="254.0,185.0 244.0,190.0 244.0,180.0" fill="#1c1b19"/><path d="M368 185 H379" stroke="#1c1b19" stroke-width="1.6" fill="none"/><polygon points="379.0,185.0 369.0,190.0 369.0,180.0" fill="#1c1b19"/>
  <path d="M493 185 H504" stroke="#1c1b19" stroke-width="1.6" fill="none"/><polygon points="504.0,185.0 494.0,190.0 494.0,180.0" fill="#1c1b19"/><path d="M618 185 H629" stroke="#1c1b19" stroke-width="1.6" fill="none"/><polygon points="629.0,185.0 619.0,190.0 619.0,180.0" fill="#1c1b19"/><path d="M743 185 H754" stroke="#1c1b19" stroke-width="1.6" fill="none"/><polygon points="754.0,185.0 744.0,190.0 744.0,180.0" fill="#1c1b19"/><path d="M868 185 H879" stroke="#1c1b19" stroke-width="1.6" fill="none"/><polygon points="879.0,185.0 869.0,190.0 869.0,180.0" fill="#1c1b19"/>

  <!-- Who moves it -->
  <text x="63" y="230" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">doctor orders</text>
  <text x="188" y="230" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">technician</text>
  <text x="313" y="230" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">technician</text>
  <text x="438" y="230" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">technician</text>
  <text x="563" y="230" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">technician</text>
  <text x="688" y="230" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">pathologist</text>
  <text x="813" y="230" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">automatic</text>
  <text x="938" y="230" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">technician</text>

  <!-- Cancelled -->
  <rect x="8" y="50" width="110" height="44" rx="8" fill="#fbeceb" stroke="#b42318" stroke-width="1.4"/><text x="63" y="77" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="10.5px" font-weight="700">CANCELLED</text>
  <path d="M63 160 V98" stroke="#b42318" stroke-width="1.6" fill="none"/><polygon points="63.0,98.0 68.0,108.0 58.0,108.0" fill="#b42318"/>
  <text x="130" y="118" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">all tests removed</text><text x="130" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">before collection</text>

  <!-- Retest loop -->
  <path d="M563 160 C563 96 438 96 438 156" stroke="#b42318" stroke-width="1.6" fill="none"/><polygon points="438.0,156.0 433.0,146.0 443.0,146.0" fill="#b42318"/>
  <text x="500" y="88" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#b42318" font-size="11px" font-weight="600">return for retest</text>
  <text x="500" y="102" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">same sample, attempt + 1</text>

  <!-- Rejected -->
  <rect x="258" y="310" width="110" height="46" rx="8" fill="#fbeceb" stroke="#b42318" stroke-width="1.4"/><text x="313" y="338" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="10.5px" font-weight="700">REJECTED</text>
  <path d="M188 210 V333 H254" stroke="#b42318" stroke-width="1.6" fill="none"/><polygon points="254.0,333.0 244.0,338.0 244.0,328.0" fill="#b42318"/>
  <text x="196" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">at receipt: haemolysed,</text><text x="196" y="304" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">clotted, too little</text>
  <path d="M438 210 V333 H372" stroke="#b42318" stroke-width="1.6" fill="none"/><polygon points="372.0,333.0 382.0,328.0 382.0,338.0" fill="#b42318"/>
  <text x="446" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">in testing: used up,</text><text x="446" y="304" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">degraded, other</text>
  <path d="M313 356 V386" stroke="#1c1b19" stroke-width="1.6" fill="none"/><polygon points="313.0,386.0 308.0,376.0 318.0,376.0" fill="#1c1b19"/>
  <rect x="188" y="388" width="250" height="36" rx="8" fill="#ffffff" stroke="#b42318" stroke-width="1.4"/>
  <text x="313" y="410" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1c1b19" font-size="11px">Redraw: a new sample starts at ORDERED</text>

  <!-- Gate note -->
  <rect x="640" y="300" width="350" height="78" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="815" y="324" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#0f766e" font-size="11px" font-weight="700">Enforced in the database, not only the app</text>
  <text x="815" y="344" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">only these moves are allowed (trigger)</text>
  <text x="815" y="359" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">no report without a verified result (trigger)</text>
  <text x="815" y="374" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px">every move is an append-only status event</text>
</svg>
