<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" width="940" height="640" role="img" aria-labelledby="t d">
  <title id="t">Core data model</title>
  <desc id="d">Sixteen core tables in four groups: clinical, billing, lab, and inventory, with one-to-many relationships between them.</desc>
  <rect width="940" height="640" rx="14" fill="#f5f4f1"/>

  <!-- Row 1: clinical -->
  <rect x="20" y="40" width="200" height="90" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/>
  <text x="34" y="62" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="13px" font-weight="700">patients</text><text x="34" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">patient_code, dob, blood_group</text><text x="34" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">user_id (nullable: walk-ins)</text><text x="34" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">claim code (hash only)</text>
  <rect x="250" y="40" width="200" height="90" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/>
  <text x="264" y="62" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="13px" font-weight="700">appointments</text><text x="264" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">kind, status, scheduled_at</text><text x="264" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">queue_token, doctor_id</text><text x="264" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">unique doctor + time slot</text>
  <rect x="480" y="40" width="200" height="90" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/>
  <text x="494" y="62" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="13px" font-weight="700">consultations</text><text x="494" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">status, diagnosis, vitals</text><text x="494" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">completed_at</text><text x="494" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">locked once completed</text>
  <rect x="710" y="40" width="200" height="90" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/>
  <text x="724" y="62" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="13px" font-weight="700">prescriptions</text><text x="724" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">prescription_number (RX-)</text><text x="724" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">medicine lines</text><text x="724" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">read-only once issued</text>
  <path d="M220 85 H246" stroke="#1c1b19" stroke-width="1.5" fill="none"/><polygon points="246.0,85.0 236.0,90.0 236.0,80.0" fill="#1c1b19"/><path d="M450 85 H476" stroke="#1c1b19" stroke-width="1.5" fill="none"/><polygon points="476.0,85.0 466.0,90.0 466.0,80.0" fill="#1c1b19"/><path d="M680 85 H706" stroke="#1c1b19" stroke-width="1.5" fill="none"/><polygon points="706.0,85.0 696.0,90.0 696.0,80.0" fill="#1c1b19"/>

  <!-- Row 2: billing + lab orders -->
  <rect x="20" y="180" width="200" height="90" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/>
  <text x="34" y="202" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="13px" font-weight="700">invoices</text><text x="34" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">invoice_code, discount + reason</text><text x="34" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">status, amount_paid</text><text x="34" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">bills a visit or a lab order</text>
  <rect x="250" y="180" width="200" height="90" rx="8" fill="#fbeceb" stroke="#b42318" stroke-width="1.4"/>
  <text x="264" y="202" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="13px" font-weight="700">payments</text><text x="374" y="202" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#b42318" font-size="10.5px" font-weight="700">append-only</text><text x="264" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">amount, method</text><text x="264" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">received_by, received_at</text>
  <rect x="480" y="180" width="200" height="90" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/>
  <text x="494" y="202" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="13px" font-weight="700">lab_orders</text><text x="494" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">order_code, priority</text><text x="494" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">status, clinical_notes</text><text x="494" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">ordering doctor</text>
  <rect x="710" y="180" width="200" height="90" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/>
  <text x="724" y="202" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="13px" font-weight="700">lab_order_items</text><text x="724" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">test_name, price_at_order</text><text x="724" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">copied at order time</text><text x="724" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">status</text>
  <path d="M220 225 H246" stroke="#1c1b19" stroke-width="1.5" fill="none"/><polygon points="246.0,225.0 236.0,230.0 236.0,220.0" fill="#1c1b19"/><text x="233" y="217" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px" font-weight="700">1:N</text>
  <path d="M680 225 H706" stroke="#1c1b19" stroke-width="1.5" fill="none"/><polygon points="706.0,225.0 696.0,230.0 696.0,220.0" fill="#1c1b19"/><text x="693" y="217" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px" font-weight="700">1:N</text>
  <path d="M580 130 V176" stroke="#1c1b19" stroke-width="1.5" fill="none"/><polygon points="580.0,176.0 575.0,166.0 585.0,166.0" fill="#1c1b19"/><text x="588" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px" font-weight="700">1</text><text x="588" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px" font-weight="700">N</text>

  <!-- Row 3: samples -->
  <rect x="20" y="320" width="200" height="90" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/>
  <text x="34" y="342" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="13px" font-weight="700">inventory_items</text><text x="34" y="362" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">unit, current_stock &#8805; 0</text><text x="34" y="378" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">low_stock_threshold</text><text x="34" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">retired, never deleted</text>
  <rect x="250" y="320" width="200" height="90" rx="8" fill="#fbeceb" stroke="#b42318" stroke-width="1.4"/>
  <text x="264" y="342" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="13px" font-weight="700">sample_status_events</text><text x="264" y="362" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">status, actor, occurred_at</text><text x="264" y="378" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#b42318" font-size="10.5px" font-weight="700">append-only</text><text x="264" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">source of turnaround time</text>
  <rect x="480" y="320" width="200" height="90" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/>
  <text x="494" y="342" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="13px" font-weight="700">samples</text><text x="494" y="362" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">sample_code, tube type</text><text x="494" y="378" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">status (checked by trigger)</text><text x="494" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">redraw_of_sample_id</text>
  <rect x="710" y="320" width="200" height="90" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/>
  <text x="724" y="342" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="13px" font-weight="700">sample_items</text><text x="724" y="362" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">one tube carries several</text><text x="724" y="378" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">order lines</text>
  <path d="M580 270 V316" stroke="#1c1b19" stroke-width="1.5" fill="none"/><polygon points="580.0,316.0 575.0,306.0 585.0,306.0" fill="#1c1b19"/><text x="588" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px" font-weight="700">1</text><text x="588" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px" font-weight="700">N</text>
  <path d="M810 270 V316" stroke="#1c1b19" stroke-width="1.5" fill="none"/><polygon points="810.0,316.0 805.0,306.0 815.0,306.0" fill="#1c1b19"/><text x="818" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px" font-weight="700">1</text><text x="818" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px" font-weight="700">N</text>
  <path d="M710 365 H684" stroke="#1c1b19" stroke-width="1.5" fill="none"/><polygon points="684.0,365.0 694.0,360.0 694.0,370.0" fill="#1c1b19"/><text x="697" y="357" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px" font-weight="700">N:1</text>
  <path d="M480 365 H454" stroke="#1c1b19" stroke-width="1.5" fill="none"/><polygon points="454.0,365.0 464.0,360.0 464.0,370.0" fill="#1c1b19"/><text x="467" y="357" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px" font-weight="700">1:N</text>

  <!-- Row 4: results and reports -->
  <rect x="20" y="460" width="200" height="90" rx="8" fill="#fbeceb" stroke="#b42318" stroke-width="1.4"/>
  <text x="34" y="482" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="13px" font-weight="700">inventory_movements</text><text x="34" y="502" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">delta, reason, note, actor</text><text x="34" y="518" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#b42318" font-size="10.5px" font-weight="700">append-only</text><text x="34" y="534" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">level after each change</text>
  <rect x="250" y="460" width="200" height="90" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/>
  <text x="264" y="482" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="13px" font-weight="700">reports</text><text x="264" y="502" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">verification_code (QR)</text><text x="264" y="518" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">is_critical + acknowledgement</text><text x="264" y="534" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">dispatched_at, receipt</text>
  <rect x="480" y="460" width="200" height="90" rx="8" fill="#ffffff" stroke="#c9c6bf" stroke-width="1.4"/>
  <text x="494" y="482" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="13px" font-weight="700">sample_results</text><text x="494" y="502" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">attempt_number, status</text><text x="494" y="518" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">entered_by, verified_by</text><text x="494" y="534" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">decided once, never edited</text>
  <rect x="710" y="460" width="200" height="90" rx="8" fill="#fbeceb" stroke="#b42318" stroke-width="1.4"/>
  <text x="724" y="482" font-family="Courier New, Courier, monospace" fill="#1c1b19" font-size="13px" font-weight="700">result_values</text><text x="838" y="482" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#b42318" font-size="10.5px" font-weight="700">append-only</text><text x="724" y="502" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">value, unit, range copy</text><text x="724" y="518" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">flag: normal, low, high,</text><text x="724" y="534" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">critical low, critical high</text>
  <path d="M120 410 V456" stroke="#1c1b19" stroke-width="1.5" fill="none"/><polygon points="120.0,456.0 115.0,446.0 125.0,446.0" fill="#1c1b19"/><text x="128" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px" font-weight="700">1</text><text x="128" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px" font-weight="700">N</text>
  <path d="M600 410 V456" stroke="#1c1b19" stroke-width="1.5" fill="none"/><polygon points="600.0,456.0 595.0,446.0 605.0,446.0" fill="#1c1b19"/><text x="608" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px" font-weight="700">1</text><text x="608" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px" font-weight="700">N</text>
  <path d="M680 505 H706" stroke="#1c1b19" stroke-width="1.5" fill="none"/><polygon points="706.0,505.0 696.0,510.0 696.0,500.0" fill="#1c1b19"/><text x="693" y="497" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px" font-weight="700">1:N</text>
  <path d="M520 410 V435 H350 V456" stroke="#1c1b19" stroke-width="1.5" fill="none"/><polygon points="350.0,456.0 345.0,446.0 355.0,446.0" fill="#1c1b19"/><text x="500" y="428" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px" font-weight="700">1</text><text x="358" y="452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#5c5954" font-size="11px" font-weight="700">1</text>

  <text x="20" y="592" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">Identity: one <tspan font-family="Courier New,monospace" font-weight="700">users</tspan> row per person with a single role; patients, doctors, pathologists and staff profiles must match it (composite foreign keys).</text>
  <text x="20" y="612" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4a4844" font-size="11.5px">Red boxes are append-only: a database trigger rejects any update or delete. Twelve Flyway migrations (V1&#8211;V12) build the schema.</text>
</svg>
